# Installeur Windows de BOBvr 0.9 (version modifiee, separee de SlimeVR officiel
# et de BOBvr 1.1 : autre appId, autre dossier, autre raccourci, les deux
# peuvent etre installees en meme temps)
appId: dev.slimevr.SlimeVR.bobvr09
productName: BOBvr 0.9
executableName: BOBvr 0.9

directories:
  output: dist/mod

asar: true
asarUnpack:
  - out/main/chunks/*.jar

electronLanguages:
  - en-US

files:
  - out/**/*
  - index.html
  - package.json
  - node_modules/**
  - "!node_modules/*/{README,readme,README.md,readme.md,CHANGELOG,CHANGELOG.md,changelog.md}"
  - "!node_modules/*/{test,tests,__tests__,docs,doc,example,examples}"
  - "!node_modules/*/.{git,github,vscode,editorconfig,eslintrc,prettierrc}"
  - "!node_modules/**/*.{map,ts,tsx,d.ts}"
  - "!**/.DS_Store"

win:
  target: nsis
  icon: "./electron/resources/icons/icon.ico"
  extraFiles:
    - from: "../server/desktop/build/libs/slimevr.jar"
      to: "."
    - from: "../server/core/resources"
      to: "."
      filter: ["**/*"]
    # Java embarque, pour ne rien avoir a installer sur l'autre PC
    - from: "./build-mod/jre"
      to: "jre"
    # Script qui enregistre SlimeVR Mod comme appli SteamVR (lancement auto)
    - from: "./electron/resources/steamvr-autostart.ps1"
      to: "steamvr-autostart.ps1"
    # Pilote SteamVR, enregistre aupres de SteamVR a l'installation
    - from: "./build-mod/slimevr-openvr-driver-win64"
      to: "slimevr-openvr-driver-win64"

# Reinstaller une version plus recente par-dessus met BOBvr 0.9 a jour :
# meme appId, l'ancienne version est remplacee et les reglages (dans
# %APPDATA%\dev.slimevr.SlimeVR, partages avec BOBvr 1.1 qui utilise
# d'autres fichiers) sont gardes. Le numero de version est donne
# par Creer-Installeur-SlimeVR-Mod.bat (date et heure de creation).
nsis:
  artifactName: "BOBvr-0.9-Installeur.${ext}"
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "BOBvr 0.9"
  include: "./electron/resources/installer-mod.nsh"
