# Installeur Windows de VitalVR (appli a part de SlimeVR et de BOBvr : autre
# appId, autre dossier, autre raccourci, autres reglages)
appId: dev.vitalvr.VitalVR
productName: VitalVR
executableName: VitalVR

directories:
  output: dist/vitalvr

asar: true
asarUnpack:
  - out/main/chunks/*.jar

electronLanguages:
  - en-US

files:
  - out/**/*
  - index.html
  - package.json
  - node_modules/**
  - "!node_modules/*/{README,readme,README.md,readme.md,CHANGELOG,CHANGELOG.md,changelog.md}"
  - "!node_modules/*/{test,tests,__tests__,docs,doc,example,examples}"
  - "!node_modules/*/.{git,github,vscode,editorconfig,eslintrc,prettierrc}"
  - "!node_modules/**/*.{map,ts,tsx,d.ts}"
  - "!**/.DS_Store"

win:
  target: nsis
  icon: "./electron/resources/icons/icon.ico"
  extraFiles:
    - from: "../server/desktop/build/libs/slimevr.jar"
      to: "."
    - from: "../server/core/resources"
      to: "."
      filter: ["**/*"]
    # Java embarque, rien a installer
    - from: "./build-vitalvr/jre"
      to: "jre"
    # Liaisons SteamVR de SlimeVR v21.1.0 (comme l'officiel)
    - from: "./build-vitalvr/bindings"
      to: "."
    # Enregistre VitalVR comme appli SteamVR (lancement auto possible)
    - from: "./electron/resources/steamvr-autostart.ps1"
      to: "steamvr-autostart.ps1"
# Pas de pilote SteamVR dans l'installeur : VitalVR parle au pilote de la v21
# deja installe sous le nom « slimevr_09 » (Activer-Pilote-BOBvr-0.9.bat)

# Reinstaller par-dessus met VitalVR a jour (meme appId), les reglages
# (%APPDATA%\dev.vitalvr.VitalVR) sont gardes. Le numero de version est donne
# par Creer-Installeur-VitalVR.bat (date et heure de creation).
nsis:
  artifactName: "VitalVR-Installeur.${ext}"
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "VitalVR"
  include: "./electron/resources/installer-mod.nsh"
